name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (from main): the version is today's date (UTC) and the day's build number"
        type: boolean
        default: false

# Releases run one at a time, so two can't take the same build number; other runs aren't held up.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.release && 'release' || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -t . -v

  version:
    # The version the builds carry. Publishing a release: today's UTC date and the day's build number,
    # YYYY.MM.DD.NN, one past today's highest tag (01 if none). Otherwise "dev".
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the tags, for the day's build number
      - id: version
        env:
          RELEASE: ${{ inputs.release && github.ref == 'refs/heads/main' }}
        run: |
          if [ "$RELEASE" = "true" ]; then
            v=$(git tag --list 'v*' | python3 scripts/release_version.py next)
          else
            v=dev
          fi
          echo "Version: $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  build:
    # Builds the downloadable apps when run by hand (Actions → CI → Run workflow).
    if: github.event_name == 'workflow_dispatch'
    needs: [test, version]
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.11.1
      - name: Stamp the version
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: python scripts/release_version.py stamp "$VERSION"
      - run: pyinstaller --noconfirm opendecodesk-machine-files.spec
      - name: Zip the macOS app
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent "OpenDecoDesk Machine Files.app" "OpenDecoDesk-Machine-Files-macOS-AppleSilicon.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDecoDesk-Machine-Files-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.exe

  release:
    # Publishes the two builds as a GitHub release when run by hand on main with "Publish a release"
    # ticked: tagged v<version>, titled with the version. The only job that may write.
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release (and its tag)
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Name the downloads
        run: |
          mv "dist/OpenDecoDesk Machine Files.exe" dist/OpenDecoDesk-Machine-Files-Windows.exe
          ls -l dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **New:** the version is now the release date and the day's build number (like 2026.11.01.01). It shows in the window's title bar and at the top of the window, beside the OpenDecoDesk name.

          Copy embroidery designs between a folder on your computer and a SmartStitch embroidery machine on your network.

          **Downloads**
          - **Windows:** `OpenDecoDesk-Machine-Files-Windows.exe` — one portable file, nothing to install. Allow it through Windows Firewall on private networks when asked (the machine scan needs it).
          - **macOS (Apple Silicon):** unzip `OpenDecoDesk-Machine-Files-macOS-AppleSilicon.zip`. The app isn't signed yet: the first time, right-click it → Open. Allow it to find devices on your local network when macOS asks. On an Intel Mac, run it from source (see the README).

          **What it does:** scan for machines, list a machine's files (slot and name), copy files to the machine and copy files off it, skipping files already there. Files come off the machine as .DSB (the machine's own format), or as .DST with **Save as .DST**. **Verify after copy** reads each file back and checks the stitches match. Browse into subfolders and back up from the folder list. It remembers the last folder, machine and options.

          Close the machine vendor's own app while using this one. Deleting files on a machine isn't possible (disabled in the firmware).
          NOTES
          gh release create "v$VERSION" --target "$GITHUB_SHA" \
            dist/OpenDecoDesk-Machine-Files-Windows.exe \
            dist/OpenDecoDesk-Machine-Files-macOS-AppleSilicon.zip \
            --repo "$GITHUB_REPOSITORY" --title "OpenDecoDesk Machine Files $VERSION" --notes-file notes.md
