name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release: v<version in machine_files/__init__.py>, from main"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -t . -v

  build:
    # Builds the downloadable apps on a version tag or when run by hand (Actions → CI → Run workflow).
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.11.1
      - run: pyinstaller --noconfirm opendecodesk-machine-files.spec
      - name: Zip the macOS app
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent "OpenDecoDesk Machine Files.app" "OpenDecoDesk-Machine-Files-macOS-AppleSilicon.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDecoDesk-Machine-Files-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.exe

  release:
    # Publishes the two builds as a GitHub release, on a version tag or when run by hand on main with
    # "Publish a release" ticked (which creates the tag v<version>). The only job that may write. A
    # version is released once: a second run for the same one fails, so bump the version first.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to create the release (and its tag)
    steps:
      - uses: actions/checkout@v5
      - name: The version
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' machine_files/__init__.py)
          if [ -z "$v" ]; then echo "::error::No __version__ in machine_files/__init__.py"; exit 1; fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$v" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match the version in machine_files/__init__.py ($v). Tag v$v instead, or change the version."
            exit 1
          fi
          echo "TAG=v$v" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Name the downloads
        run: |
          mv "dist/OpenDecoDesk Machine Files.exe" dist/OpenDecoDesk-Machine-Files-Windows.exe
          ls -l dist
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          **New in 0.6.1:** the app's icon — the OpenDecoDesk hoop with the D, on a folder — also in the window's title bar and the taskbar / dock.

          Copy embroidery designs between a folder on your computer and a SmartStitch embroidery machine on your network.

          **Downloads**
          - **Windows:** `OpenDecoDesk-Machine-Files-Windows.exe` — one portable file, nothing to install. Allow it through Windows Firewall on private networks when asked (the machine scan needs it).
          - **macOS (Apple Silicon):** unzip `OpenDecoDesk-Machine-Files-macOS-AppleSilicon.zip`. The app isn't signed yet: the first time, right-click it → Open. Allow it to find devices on your local network when macOS asks. On an Intel Mac, run it from source (see the README).

          **What it does:** scan for machines, list a machine's files (slot and name), copy files to the machine and copy files off it, skipping files already there. Files come off the machine as .DSB (the machine's own format), or as .DST with **Save as .DST**. **Verify after copy** reads each file back and checks the stitches match. Browse into subfolders and back up from the folder list. It remembers the last folder, machine and options.

          Close the machine vendor's own app while using this one. Deleting files on a machine isn't possible (disabled in the firmware).
          NOTES
          gh release create "$TAG" --target "$GITHUB_SHA" \
            dist/OpenDecoDesk-Machine-Files-Windows.exe \
            dist/OpenDecoDesk-Machine-Files-macOS-AppleSilicon.zip \
            --repo "$GITHUB_REPOSITORY" --title "OpenDecoDesk Machine Files $TAG" --notes-file notes.md
