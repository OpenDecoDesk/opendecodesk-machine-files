name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tests
        run: python -m unittest discover -s tests -t . -v

  build:
    # Builds the downloadable apps on a version tag or when run by hand (Actions → CI → Run workflow).
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyinstaller==6.11.1
      - run: pyinstaller --noconfirm opendecodesk-machine-files.spec
      - name: Zip the macOS app
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent "OpenDecoDesk Machine Files.app" "OpenDecoDesk-Machine-Files-macOS.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenDecoDesk-Machine-Files-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.exe
